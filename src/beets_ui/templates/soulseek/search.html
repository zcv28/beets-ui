{% extends "base.html" %}
{% from "partials/macros.html" import icon %}
{% block title %}{{ search.searchText }}{% endblock %}
{% block content %}
{% set tab = 'search' %}{% include "soulseek/_tabs.html" %}
<div class="tab-content">
<form method="post" action="/soulseek/search" class="bar">
  <div class="input-group grow">{{ icon('search') }}<input class="input" type="search" name="q" value="{{ search.searchText }}" required minlength="3" aria-label="Search Soulseek"></div>
  <button class="btn" data-variant="outline">Search again</button>
</form>
<form method="get" class="bar" data-autosubmit>
  <select class="input auto" data-size="sm" name="fmt" aria-label="Format">
    <option value="">Any format</option>
    {% for f in ['lossless', 'flac', 'mp3', 'm4a', 'opus', 'ogg'] %}<option value="{{ f }}" {% if fmt == f %}selected{% endif %}>{{ f|upper if f != 'lossless' else 'Lossless' }}</option>{% endfor %}
  </select>
  <label class="checkbox-item"><input class="checkbox" type="checkbox" name="free" value="1" {% if free %}checked{% endif %}>Free upload slot only</label>
  <noscript><button class="btn" data-variant="outline" data-size="sm">Apply</button></noscript>
</form>
{% include "soulseek/_results.html" %}
</div>
{% endblock %}
