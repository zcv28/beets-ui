{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block bare %}
<div class="nc-backdrop login">
<section class="nc-window nc-dialog" aria-labelledby="login-title">
  <div class="nc-titlebar"><span class="nc-titlebar__text" id="login-title">beets-ui — Log In</span></div>
  <form class="nc-window__body nc-form" method="post" action="/login">
    {% if error %}<div class="warn">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    {% if ldap %}
    <label class="nc-label" for="username">Username<input type="text" id="username" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus></label>
    {% endif %}
    <label class="nc-label" for="password">Password<input type="password" id="password" name="password" autocomplete="current-password" required {% if not ldap %}autofocus{% endif %}></label>
    <p class="nc-hint">{% if ldap %}Sign in with your directory account.{% else %}Use the password from <code>BEETSUI_PASSWORD</code>.{% endif %}</p>
    <div class="bar right"><button class="nc-btn nc-btn--accent" type="submit">Log In</button></div>
  </form>
</section>
</div>
{% endblock %}
