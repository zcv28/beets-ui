{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="login">
  <h1>beets-ui</h1>
  {% if error %}<div class="warn">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    {% if ldap %}
    <label for="username">Username</label>
    <input type="text" id="username" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus>
    {% endif %}
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required {% if not ldap %}autofocus{% endif %}>
    <button class="btn btn-a" type="submit">Log in</button>
  </form>
  <p class="muted">{% if ldap %}Sign in with your directory account.{% else %}Use the password from <code>BEETSUI_PASSWORD</code>.{% endif %}</p>
</div>
{% endblock %}
