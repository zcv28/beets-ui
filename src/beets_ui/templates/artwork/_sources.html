<fieldset class="choice-group">
  <legend class="label">Sources</legend>
  {% for s in sources %}<label class="checkbox-item" title="{{ 'Needs an API key' if not s.available else '' }}"><input class="checkbox" type="checkbox" name="src" value="{{ s.name }}" {% if s.enabled and s.available %}checked{% endif %} {% if not s.available %}disabled{% endif %}>{{ s.label }}{% if not s.available %} <span class="hint">(no key)</span>{% endif %}</label>{% endfor %}
</fieldset>
