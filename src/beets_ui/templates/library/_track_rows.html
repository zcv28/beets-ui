{% for it in items %}<tr class="table-row"><td class="table-cell">{{ it.artist }}</td><td class="table-cell"><a href="/library/item/{{ it.id }}">{{ it.title or '(untitled)' }}</a></td><td class="table-cell">{% if it.album_id %}<a href="/library/album/{{ it.album_id }}">{{ it.album }}</a>{% else %}<span class="hint">Singleton</span>{% endif %}</td><td class="table-cell num">{{ it.length|duration }}</td><td class="table-cell hide-sm"><span class="badge" data-variant="outline" data-mono>{{ it.format }}{% if it.bitrate %} {{ it.bitrate // 1000 }}{% endif %}</span></td></tr>
{% endfor %}
{% if more %}<tr class="table-row more-row" hx-get="/library/tracks?q={{ q|q }}&singletons={{ singletons }}&page={{ page + 1 }}" hx-trigger="revealed" hx-swap="outerHTML"><td class="table-cell" colspan="5"><a href="/library/tracks?q={{ q|q }}&singletons={{ singletons }}&page={{ page + 1 }}">Load more</a></td></tr>{% endif %}
