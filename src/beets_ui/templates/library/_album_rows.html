{% for a in albums %}<tr class="table-row"><td class="table-cell"><div class="title-cell"><span class="cover" aria-hidden="true"><img loading="lazy" src="/library/album/{{ a.id }}/cover?size=96" alt=""></span><div class="table-cell-title"><a class="strong" href="/library/album/{{ a.id }}">{{ a.album or '(untitled)' }}</a><span class="hint">{{ a.albumartist }}</span></div></div></td><td class="table-cell num">{{ a.year or '' }}</td><td class="table-cell hide-sm">{{ a.formatted().get('genres', '') }}</td><td class="table-cell hide-sm">{{ a.label }}</td></tr>
{% endfor %}
{% if more %}<tr class="table-row more-row" hx-get="/library?q={{ q|q }}&sort={{ sort }}&view={{ view }}&page={{ page + 1 }}" hx-trigger="revealed" hx-swap="outerHTML"><td class="table-cell" colspan="4"><a href="/library?q={{ q|q }}&sort={{ sort }}&view={{ view }}&page={{ page + 1 }}">Load more</a></td></tr>{% endif %}
