{% from "partials/macros.html" import status %}<div class="alert" data-status="info" role="status" hx-get="/inbox/folder/status?f={{ folder.path|q }}&was={{ folder.status }}" hx-trigger="every 2s" hx-swap="outerHTML">
  <svg class="alert-icon spinner" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
  <div class="alert-content"><p class="alert-title">{{ labels.get(folder.status, folder.status) }}. Working on it.</p>{% if folder.job_id %}<p class="alert-description"><a href="/jobs/{{ folder.job_id }}">Job #{{ folder.job_id }} log</a></p>{% endif %}</div>
</div>
